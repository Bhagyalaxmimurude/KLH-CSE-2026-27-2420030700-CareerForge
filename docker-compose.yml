services:
  postgres:
    image: postgres:17
    container_name: careerforge-postgres
    environment:
      POSTGRES_DB: careerforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5436:5432"
    volumes:
      - careerforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: careerforge-ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: careerforge-backend:latest
    container_name: careerforge-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerforge
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: 8082
      CAREERFORGE_ML_API_URL: http://ml-service:8000
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    image: careerforge-frontend:latest
    container_name: careerforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  careerforge-postgres-data:
